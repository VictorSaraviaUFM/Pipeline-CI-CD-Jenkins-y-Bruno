info:
  name: /books
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/books"
  body:
    type: json
    data: |-
      {
        "title": "Software Testing Basics",
        "author": "Equipo QA",
        "year": 2026,
        "copies": 2
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("crea el libro y devuelve su ubicación", function () {
          expect(res.getStatus()).to.equal(201);
          expect(res.getBody().id).to.equal(4);
          expect(res.getBody().title).to.equal("Software Testing Basics");
          expect(res.getBody().copies).to.equal(2);
          expect(res.getHeader("Location")).to.equal("/books/4");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
