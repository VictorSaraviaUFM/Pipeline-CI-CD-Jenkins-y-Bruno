info:
  name: /health
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/health"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("el servicio responde con tres libros", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().status).to.equal("ok");
          expect(res.getBody().books).to.equal(3);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
