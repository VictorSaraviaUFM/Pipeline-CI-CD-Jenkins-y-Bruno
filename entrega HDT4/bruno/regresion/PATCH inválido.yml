info:
  name: PATCH inválido
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/books/4"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("conserva 999 copias después del PATCH rechazado", function () {
          const book = res.getBody();
          expect(res.getStatus()).to.equal(200);
          expect(book.id).to.equal(4);
          expect(book.copies).to.equal(999);
          expect(book.title).to.equal("Boundary Year");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Técnica: transición de estados. Valor probado: consultar el libro después de un PATCH inválido. Resultado esperado: 200 y `copies=999`; el intento rechazado no modifica el estado."
