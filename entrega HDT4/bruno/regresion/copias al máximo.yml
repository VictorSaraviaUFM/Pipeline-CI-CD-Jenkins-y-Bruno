info:
  name: copias al máximo
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/books/4"
  body:
    type: json
    data: |-
      {
        "copies": 999
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("acepta el máximo de copias", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().copies).to.equal(999);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Técnica: valores frontera. Valor probado: `copies=999`, máximo válido. Resultado esperado: 200 y `copies=999`."
